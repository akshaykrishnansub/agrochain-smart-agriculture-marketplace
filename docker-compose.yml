
services:
  agrochain:
    image: agrochain:latest
    container_name: agrochain-app
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      PORT: 5000
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agrochain-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
